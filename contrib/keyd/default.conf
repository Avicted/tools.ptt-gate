# keyd config for ptt-gate: Caps Lock becomes F24, the push-to-talk key.
# Installed to /etc/keyd/default.conf by scripts/setup.sh.
#
# [ids] limits the remap to one keyboard. 3434:0b11:abb10b40 is the *keyboard*
# interface of the Keychron Q1 HE; its other interfaces (mouse, joystick) must
# not be listed. For a different keyboard, run `sudo keyd monitor`, press a
# key, and use the ID printed next to it.
#
# F24 rather than a modifier: nothing binds it, so holding it in a game never
# turns other keys into Ctrl+key combos, and it is not a locking key.
# Key names are keyd's, not the kernel's: an invalid name (e.g. `rightctrl`
# instead of `rightcontrol`) is silently ignored.

[ids]
3434:0b11:abb10b40

[main]
capslock = f24
