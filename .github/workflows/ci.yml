name: CI

on:
  push:
    branches: [master]
  pull_request:

# Least privilege: nothing here publishes.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Drives make targets rather than repeating commands, so CI and a local
  # `make check` cannot drift apart.
  native:
    name: Build, test, sanitizers, analysis (${{ matrix.cc }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        cc: [gcc, clang]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libpulse-dev libcmocka-dev shellcheck valgrind

      # -Werror is part of the Makefile's WARN_CFLAGS, so every build below has it.
      - name: Build and test
        run: make test CC=${{ matrix.cc }}

      - name: AddressSanitizer + LeakSanitizer
        run: make test-asan CC=${{ matrix.cc }}

      - name: UndefinedBehaviorSanitizer
        run: make test-ubsan CC=${{ matrix.cc }}

      # Ubuntu's generic glibc is one valgrind can run, unlike CachyOS znver4.
      - name: valgrind memcheck
        run: make test-valgrind CC=${{ matrix.cc }}

      - name: Static analysis (-fanalyzer, clang-tidy, shellcheck)
        run: make analyze CC=${{ matrix.cc }}

      - name: Hardening
        run: make hardening-check CC=${{ matrix.cc }}
