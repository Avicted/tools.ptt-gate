name: CI

on:
  push:
    branches: [master, main]
  pull_request:

# Least privilege: nothing here publishes.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Drives make targets rather than repeating commands, so CI and a local
  # `make check` cannot drift apart.
  native:
    name: Build, test, sanitizers, analysis (${{ matrix.cc }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        cc: [gcc, clang]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libpulse-dev libcmocka-dev shellcheck

      - name: Build and test with warnings as errors
        run: make test CC=${{ matrix.cc }} EXTRA_CFLAGS=-Werror

      - name: Re-run the suites under ASan/UBSan
        run: make test-asan CC=${{ matrix.cc }}

      - name: Static analysis (-fanalyzer, clang-tidy, shellcheck)
        run: make analyze CC=${{ matrix.cc }}

      - name: Hardening
        run: make hardening-check CC=${{ matrix.cc }}
